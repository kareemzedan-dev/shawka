<body style="background-color:#000000;margin:0;">
  <div id="loading" style="position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#000000;font-family:system-ui,sans-serif;color:#D4AF37;">
    <p style="margin:0;font-size:1.1rem;">جاري التحميل…</p>
  </div>
  <script>
    // Remove stale service workers that can serve broken cached assets.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (r) { r.unregister(); });
      });
    }

    function hideLoading() {
      var el = document.getElementById('loading');
      if (el) el.remove();
    }

    window.addEventListener('flutter-first-frame', hideLoading);

    // Newer Flutter web builds may not fire flutter-first-frame reliably.
    var bootObserver = new MutationObserver(function () {
      if (document.querySelector('flutter-view, flt-glass-pane')) {
        hideLoading();
        bootObserver.disconnect();
      }
    });
    bootObserver.observe(document.body, { childList: true, subtree: true });

    window.addEventListener('error', function (e) {
      var el = document.getElementById('loading');
      if (!el) return;
      el.innerHTML = '<p style="margin:0;color:#F1D27B;text-align:center;padding:1rem;">'
        + 'تعذّر تحميل التطبيق. '
        + '<button onclick="location.reload()" style="margin-top:0.75rem;padding:0.5rem 1rem;border:0;border-radius:8px;background:#D4AF37;color:#0A0A0A;cursor:pointer;font-weight:700;">إعادة المحاولة</button>'
        + '</p>';
      console.error(e.error || e.message);
    });
  </script>
